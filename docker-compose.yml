version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - agri_network
    depends_on:
      - database

  database:
    image: timescale/timescaledb:latest-pg15
    container_name: agri_database
    environment:
      POSTGRES_DB: agricultural_ai
      POSTGRES_USER: agri_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TIMESCALEDB_TELEMETRY: off
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    env_file:
      - .env
    networks:
      - agri_network

volumes:
  postgres_data:

networks:
  agri_network:
    driver: bridge
